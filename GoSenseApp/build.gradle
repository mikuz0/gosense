apply plugin: 'com.android.application'

def homePath = System.properties['user.home']
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

android {
    namespace 'com.draekko.gosense'
    compileSdk 33

    defaultConfig {
        applicationId "com.draekko.gosense"
        minSdk 29
        targetSdk 33
        versionCode 20250006
        versionName "2025.6"
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        Default {
            storeFile rootProject.file(keystoreProperties['storeReleaseFile'])
            storePassword keystoreProperties['storeReleasePassword']
            keyPassword keystoreProperties['keyReleasePassword']
            keyAlias keystoreProperties['keyReleaseAlias']
        }
        debug {
            storeFile rootProject.file(keystoreProperties['storeDebugFile'])
            storePassword keystoreProperties['storeDebugPassword']
            keyPassword keystoreProperties['keyDebugPassword']
            keyAlias keystoreProperties['keyDebugAlias']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.Default
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    releaseImplementation(files('libs/AndroidPlot-release-20250307060614.aar'))
    debugImplementation(files('libs/AndroidPlot-debug-20250307060614.aar'))

    releaseImplementation(files('libs/BlessedAndroid-release-20250307060614.aar'))
    debugImplementation(files('libs/BlessedAndroid-debug-20250307060614.aar'))

    releaseImplementation(files('libs/Tray-release-20241213054130.aar'))
    debugImplementation(files('libs/Tray-debug-20241213054130.aar'))

    releaseImplementation(files('libs/ColorPickerView-release-20250121062524.aar'))
    debugImplementation(files('libs/ColorPickerView-debug-20250121062524.aar'))

    releaseImplementation(files('libs/IconContextMenu-release-20250121062524.aar'))
    debugImplementation(files('libs/IconContextMenu-debug-20250121062524.aar'))

    releaseImplementation(files('libs/TrayPrefsAX-release-20250121062524.aar'))
    debugImplementation(files('libs/TrayPrefsAX-debug-20250121062524.aar'))

    releaseImplementation(files('libs/MaterialFilePicker-release-20250203052616.aar'))
    debugImplementation(files('libs/MaterialFilePicker-debug-20250203052616.aar'))

    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.6.1'

    implementation 'androidx.constraintlayout:constraintlayout:1.1.3' // 2.0.4 2.1.4 2.2.0

    implementation 'androidx.navigation:navigation-fragment:2.1.0'
    implementation 'androidx.navigation:navigation-ui:2.1.0'

    // for blessed-android output logging
    implementation 'com.jakewharton.timber:timber:5.0.1'
    implementation 'org.jetbrains:annotations:20.1.0'

    // TrayPrefsAX dependencies
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'androidx.fragment:fragment:1.3.6'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // AndroidPlot dependencies
    implementation 'com.halfhp.fig:figlib:1.0.11'
    implementation 'androidx.annotation:annotation:1.8.2'
}