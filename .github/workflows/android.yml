name: Android CI

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Важно: без этого шаг создания релиза упадёт

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create debug keystore and keystore.properties
      run: |
        mkdir -p $HOME/.android
        if [ ! -f "$HOME/.android/debug.keystore" ]; then
          keytool -genkey -v -keystore $HOME/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
        fi
        cat > keystore.properties <<EOF
        storeDebugFile=$HOME/.android/debug.keystore
        storeDebugPassword=android
        keyDebugPassword=android
        keyDebugAlias=androiddebugkey
        storeReleaseFile=$HOME/.android/debug.keystore
        storeReleasePassword=android
        keyReleasePassword=android
        keyReleaseAlias=androiddebugkey
        EOF

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GoSense-debug-apk
        path: GoSenseApp/build/outputs/apk/debug/GoSenseApp-debug.apk

    - name: Create Release and Upload APK
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: GoSenseApp/build/outputs/apk/debug/GoSenseApp-debug.apk
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

