name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Позволяет запускать сборку вручную

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Этот шаг нужен, если build.gradle требует keystore.properties даже для debug
    - name: Create dummy keystore.properties
      run: |
        echo "storeDebugFile=$HOME/.android/debug.keystore" >> keystore.properties
        echo "storeDebugPassword=android" >> keystore.properties
        echo "keyDebugPassword=android" >> keystore.properties
        echo "keyDebugAlias=androiddebugkey" >> keystore.properties
        echo "storeReleaseFile=$HOME/.android/debug.keystore" >> keystore.properties
        echo "storeReleasePassword=android" >> keystore.properties
        echo "keyReleasePassword=android" >> keystore.properties
        echo "keyReleaseAlias=androiddebugkey" >> keystore.properties

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: GoSense-debug-apk
        path: GoSenseApp/build/outputs/apk/debug/GoSenseApp-debug.apk
