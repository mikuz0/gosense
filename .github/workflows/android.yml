name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create debug keystore and keystore.properties
      run: |
        mkdir -p $HOME/.android
        if [ ! -f "$HOME/.android/debug.keystore" ]; then
          keytool -genkey -v -keystore $HOME/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
        fi
        echo "storeDebugFile=$HOME/.android/debug.keystore" >> keystore.properties
        echo "storeDebugPassword=android" >> keystore.properties
        echo "keyDebugPassword=android" >> keystore.properties
        echo "keyDebugAlias=androiddebugkey" >> keystore.properties
        echo "storeReleaseFile=$HOME/.android/debug.keystore" >> keystore.properties
        echo "storeReleasePassword=android" >> keystore.properties
        echo "keyReleasePassword=android" >> keystore.properties
        echo "keyReleaseAlias=androiddebugkey" >> keystore.properties

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: GoSense-debug-apk
        path: GoSenseApp/build/outputs/apk/debug/GoSenseApp-debug.apk
